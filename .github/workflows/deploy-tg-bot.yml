name: Deploy Telegram bot to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "apps/tg-bot/**"
      - ".github/workflows/deploy-tg-bot.yml"
  workflow_dispatch:

concurrency:
  group: deploy-tg-bot
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy namenlos-tg-bot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/tg-bot
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/tg-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.88.0"
          workingDirectory: apps/tg-bot
          command: deploy
          secrets: |
            TELEGRAM_BOT_TOKEN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.NAMENLOS_TG_BOT_TOKEN }}

      - name: Register webhook, commands and menu button
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.NAMENLOS_TG_BOT_TOKEN }}
          BOT_URL: https://namenlos-tg-bot.unitl.workers.dev
        run: |
          KEY=$(printf %s "setup:namenlos" | openssl dgst -sha256 -hmac "$TELEGRAM_BOT_TOKEN" | awk '{print $NF}')
          echo "::add-mask::$KEY"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$BOT_URL/health" >/dev/null; then break; fi
            sleep 10
          done
          curl -fsS -X POST -H "X-Setup-Key: $KEY" "$BOT_URL/setup"
          echo
