name: TEMP Cloudflare diagnose (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pair: [default]
    steps:
      - name: Diagnose (GET only)
        env:
          TOK_DEFAULT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC_DEFAULT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOK_PROTON: ${{ secrets.CLOUDFLARE_PROTON_API_TOKEN }}
          ACC_PROTON: ${{ secrets.CLOUDFLARE_PROTON_ACCOUNT_ID }}
          PAIR: ${{ matrix.pair }}
        run: |
          if [ "$PAIR" = default ]; then T="$TOK_DEFAULT"; A="$ACC_DEFAULT"; else T="$TOK_PROTON"; A="$ACC_PROTON"; fi
          api() { curl -sS -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4$1"; }
          SUB=$(api /accounts/$A/workers/subdomain | jq -r '.result.subdomain')
          setsub() { curl -sS -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d "{\"enabled\":$1,\"previews_enabled\":false}" https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/imtryingtodesign/subdomain | jq -c '{success, errors, result}'; }
          echo "== enable workers.dev temporarily"; setsub true
          for i in 1 2 3 4 5 6; do sleep 10; c=$(curl -sS -o /tmp/b -w '%{http_code}' https://imtryingtodesign.$SUB.workers.dev/); echo "try $i: $c"; [ "$c" = 200 ] && break; done
          echo "== title"; grep -oE '<title>[^<]*</title>' /tmp/b | head -1; echo "bytes=$(wc -c </tmp/b)"; grep -oE '<h1[^>]*>[^<]{0,80}' /tmp/b | head -2
          echo "== http redirect check"; curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' http://imtryingtodesign.$SUB.workers.dev/
          echo "== disable workers.dev again"; setsub false
