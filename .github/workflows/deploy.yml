name: Deploy Studio to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "apps/studio/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        if: ${{ hashFiles('apps/studio/wrangler.jsonc') != '' && contains(fromJSON('["skip"]'), 'skip') == false }}
        run: |
          if grep -q '"d1_databases"' wrangler.jsonc && grep -q 'database_id' wrangler.jsonc; then
            npx wrangler d1 migrations apply imtrtdweb --remote
          else
            echo "No D1 database in wrangler.jsonc — skipping (AppStore DO SQLite is used)."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.88.0"
          workingDirectory: apps/studio
          command: deploy
