name: Check Telegram bot

on:
  # Every PR: "tg-bot" is a required status check, so it must report on PRs that do not touch the bot
  # too. The job decides below whether the bot changed; if not, it passes without building anything.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "apps/tg-bot/**"
      - ".github/workflows/check-tg-bot.yml"

concurrency:
  group: check-tg-bot-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Stable check name for required status checks: "tg-bot"
  tg-bot:
    name: tg-bot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/tg-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the bot change?
        id: changed
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "bot=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "$base"...HEAD -- apps/tg-bot .github/workflows/check-tg-bot.yml; then
            echo "bot=false" >> "$GITHUB_OUTPUT"; echo "apps/tg-bot untouched: nothing to check."
          else
            echo "bot=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changed.outputs.bot == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/tg-bot/package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.bot == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changed.outputs.bot == 'true'
        run: npm run check

      - name: Dry-run deploy
        if: steps.changed.outputs.bot == 'true'
        run: npm run build

      - name: Smoke AI (@cf/openai/gpt-oss-20b)
        if: steps.changed.outputs.bot == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MODEL: "@cf/openai/gpt-oss-20b"
        run: npm run smoke:ai
