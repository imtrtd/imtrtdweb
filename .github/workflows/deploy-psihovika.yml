name: Deploy psy to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "apps/psihovika/**"
      - ".github/workflows/deploy-psihovika.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy psy (Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/psihovika
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/psihovika/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Postgres + auth secrets
        id: secrets
        working-directory: ${{ github.workspace }}
        env:
          EXISTING_DB: ${{ secrets.PSY_DATABASE_URL || secrets.DATABASE_URL }}
          EXISTING_AUTH: ${{ secrets.BETTER_AUTH_SECRET }}
          EXISTING_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/psy-secrets"
          if [ -n "${EXISTING_DB}" ]; then
            printf '%s' "$EXISTING_DB" > "$RUNNER_TEMP/psy-secrets/database_url"
            echo "db_source=repo_secret" >> "$GITHUB_OUTPUT"
          else
            echo "No PSY_DATABASE_URL / DATABASE_URL — provisioning claimable Neon (72h unless claimed)"
            RESP=$(curl -sS -X POST "https://neon.new/api/v1/database" \
              -H "Content-Type: application/json" \
              -d '{"ref":"psy-imtrtd-workers"}')
            echo "$RESP" | jq -r '.connection_string' > "$RUNNER_TEMP/psy-secrets/database_url"
            CLAIM=$(echo "$RESP" | jq -r '.claim_url')
            echo "db_source=neon_new" >> "$GITHUB_OUTPUT"
            echo "claim_url=$CLAIM" >> "$GITHUB_OUTPUT"
            {
              echo "### Neon database"
              echo ""
              echo "Provisioned a claimable Postgres for psy. Claim it (keeps the DB beyond 72h):"
              echo ""
              echo "$CLAIM"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${EXISTING_AUTH}" ]; then
            printf '%s' "$EXISTING_AUTH" > "$RUNNER_TEMP/psy-secrets/better_auth_secret"
          else
            # Stable fallback so redeploys without a repo secret do not rotate sessions.
            printf '%s' "psy-workers-better-auth-set-BETTER_AUTH_SECRET" > "$RUNNER_TEMP/psy-secrets/better_auth_secret"
            echo "::warning::BETTER_AUTH_SECRET repo secret missing — using a fixed Worker placeholder. Set the secret for production."
          fi
          printf '%s' "${EXISTING_AUTH_URL:-https://psy.unitl.workers.dev}" > "$RUNNER_TEMP/psy-secrets/better_auth_url"
          {
            echo "DATABASE_URL=$(cat "$RUNNER_TEMP/psy-secrets/database_url")"
            echo "PSY_DATABASE_URL=$(cat "$RUNNER_TEMP/psy-secrets/database_url")"
            echo "BETTER_AUTH_SECRET=$(cat "$RUNNER_TEMP/psy-secrets/better_auth_secret")"
            echo "BETTER_AUTH_URL=$(cat "$RUNNER_TEMP/psy-secrets/better_auth_url")"
          } >> "$GITHUB_ENV"

      - name: Apply Postgres migrations
        run: npm run db:migrate

      - name: Build for Cloudflare
        run: npm run build:cloudflare
        env:
          DEPLOY_TARGET: cloudflare

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.88.0"
          workingDirectory: apps/psihovika
          command: deploy
          secrets: |
            DATABASE_URL
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
