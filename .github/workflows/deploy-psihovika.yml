name: Deploy ПсихоВика to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "apps/psihovika/**"
      - ".github/workflows/deploy-psihovika.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy psihovika (Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/psihovika
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/psihovika/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npm run build:cloudflare
        env:
          DEPLOY_TARGET: cloudflare

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.88.0"
          workingDirectory: apps/psihovika
          command: deploy
