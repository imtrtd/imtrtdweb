name: Deploy psy to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "apps/psihovika/**"
      - ".github/workflows/deploy-psihovika.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy psy (Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/psihovika
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/psihovika/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        env:
          DATABASE_URL: ${{ secrets.PSY_DATABASE_URL || secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          EDITOR_EMAILS: ${{ secrets.EDITOR_EMAILS }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Set repo secret PSY_DATABASE_URL (or DATABASE_URL) — a persistent Postgres is required."
            exit 1
          fi
          if [ -z "${BETTER_AUTH_SECRET}" ]; then
            echo "::error::Set repo secret BETTER_AUTH_SECRET (e.g. openssl rand -base64 32)."
            exit 1
          fi
          echo "::add-mask::${DATABASE_URL}"
          echo "::add-mask::${BETTER_AUTH_SECRET}"
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "PSY_DATABASE_URL=${DATABASE_URL}"
            echo "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}"
            echo "BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://psy.unitl.workers.dev}"
            echo "EDITOR_EMAILS=${EDITOR_EMAILS}"
          } >> "$GITHUB_ENV"

      - name: Build for Cloudflare
        run: npm run build:cloudflare
        env:
          DEPLOY_TARGET: cloudflare

      - name: Apply Postgres migrations
        run: npm run db:migrate

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.88.0"
          workingDirectory: apps/psihovika
          command: deploy
          secrets: |
            DATABASE_URL
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            EDITOR_EMAILS
