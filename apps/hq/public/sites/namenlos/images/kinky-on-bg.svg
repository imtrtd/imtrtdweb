<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="table" tableValues="0 0.55 0"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="multiply"/>
    </filter>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050505" stop-opacity="1"/>
      <stop offset="42%" stop-color="#050505" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tape" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="28" height="28" fill="#050505"/>
      <rect width="14" height="28" fill="#f5c518"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#070707"/>
  <g filter="url(#grain)" opacity="0.55">
    <rect width="1200" height="800" fill="#1a1a1a"/>
  </g>
  <g fill="none" stroke="#cfc8b8" stroke-width="10" opacity="0.22">
    <path d="M780 0 v220 h90 v580"/>
    <path d="M920 80 v140 h70 v580"/>
