services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cuebox
      POSTGRES_PASSWORD: cuebox
      POSTGRES_DB: cuebox
    volumes:
      - cuebox_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuebox -d cuebox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cuebox_pg:
